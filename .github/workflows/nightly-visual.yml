name: Nightly Visual Verification

# Drives the compiled web app in headless Chrome (integration_test suite via
# scripts/verify_web.sh) every night, but only when master gained a new commit
# since the last successful run. Screenshots are uploaded as an artifact for
# visual review. NOTE: GitHub auto-disables scheduled workflows after ~60 days
# without repo activity — a push re-enables them.

on:
  schedule:
    - cron: '0 15 * * *' # ~1am AEST
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip when no new commit since the last successful run
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-visual.yml/runs?status=success&branch=master&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty' || true)"
          echo "last-success=$last  current=$GITHUB_SHA"
          if [ -n "$last" ] && [ "$last" = "$GITHUB_SHA" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No new commit — skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Flutter
        if: steps.gate.outputs.run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: flutter pub get

      - name: Drive the web app in headless Chrome
        if: steps.gate.outputs.run == 'true'
        run: ./scripts/verify_web.sh

      - name: Upload screenshots
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots-${{ github.sha }}
          path: build/integration_screenshots/
          retention-days: 14
          if-no-files-found: warn
