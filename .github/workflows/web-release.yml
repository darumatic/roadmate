name: Web Release

# The release pipeline. Every push to master runs the three gates in
# parallel:
#   - CodeQL — GitHub's default-setup scan (org security configuration, no
#     workflow file in this repo), bound in by a gate that polls for its
#     dynamic workflow run because `needs:` cannot reference it,
#   - Flutter CI — analyze + unit tests + Firestore rules suite (reusable
#     workflow), and
#   - Visual Verification — the compiled web app driven in headless Chrome
#     (reusable workflow),
# and only when all three succeed deploys web + Firestore rules + indexes to
# production (https://roadmate.club) with the FIREBASE_SERVICE_ACCOUNT
# secret (uploaded by scripts/setup_release_secrets.sh). The terminal never
# deploys web: scripts/release.sh stops at the push and this pipeline takes
# over (watch it with scripts/check_ci.sh). Store builds are a separate
# manual step — mobile-release.yml.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Serialize releases and never cancel a deploy mid-flight. Rapid successive
# commits collapse onto the newest queued run, which deploys the newest code.
concurrency:
  group: web-release
  cancel-in-progress: false

jobs:
  codeql:
    name: CodeQL gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Wait for this commit's CodeQL analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Default setup runs as a "dynamic" workflow
          # (dynamic/github-code-scanning/codeql; run names vary — "CodeQL",
          # "Code Quality: ...") whose check runs report under the ordinary
          # github-actions app, so the reliable signal is the dynamic
          # workflow run for this commit, matched by its path.
          # 45 polls x 20s = 15 min ceiling (the scan itself takes ~2-6 min).
          for i in $(seq 1 45); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.path | startswith("dynamic/github-code-scanning/"))]')"
            total="$(echo "$runs" | jq 'length')"
            pending="$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')"
            failed="$(echo "$runs" | jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped")] | length')"
            if [ "$total" -gt 0 ] && [ "$failed" -gt 0 ]; then
              echo "CodeQL failed for $GITHUB_SHA:" >&2
              echo "$runs" | jq -r '.[] | "  \(.name): \(.status)/\(.conclusion)"' >&2
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ]; then
              echo "CodeQL green:"
              echo "$runs" | jq -r '.[] | "  \(.name): \(.conclusion)"'
              exit 0
            fi
            echo "  waiting for CodeQL ($i/45): found=$total pending=$pending"
            sleep 20
          done
          echo "Timed out waiting for the CodeQL default-setup run on $GITHUB_SHA." >&2
          echo "If default setup was turned off org-side, rework this gate before releasing." >&2
          exit 1

  flutter-ci:
    name: Flutter CI
    uses: ./.github/workflows/flutter-ci.yml

  visual-verification:
    name: Visual Verification
    uses: ./.github/workflows/visual-verification.yml

  deploy:
    name: Deploy web
    needs: [codeql, flutter-ci, visual-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release (with deploy guards)
        run: ./scripts/build_web.sh

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Deploy to Firebase (hosting + rules + indexes)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is not set —" >&2
            echo "run ./scripts/setup_release_secrets.sh on the VPS." >&2
            exit 1
          fi
          keyfile="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$keyfile"
          export GOOGLE_APPLICATION_CREDENTIALS="$keyfile"
          firebase deploy --only hosting,firestore:rules,firestore:indexes --non-interactive
          rm -f "$keyfile"

      - name: Released
        env:
          ROADMATE_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          version="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' lib/version.dart | head -1)"
          echo "Live at https://roadmate.club (v$version)"
          # Push the owner an alert naming the version. `|| true`: the deploy
          # has already succeeded, so a flaky ntfy call must never fail the
          # job. An unset NTFY_TOPIC secret makes notify.py a silent no-op.
          python3 - "$version" <<'PY' || true
          import sys
          sys.path.insert(0, 'scripts')
          from notify import notify_release
          notify_release('Web', sys.argv[1], 'Live at https://roadmate.club.')
          PY
