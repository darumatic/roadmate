name: Flutter CI

# Runs standalone on pull requests. On master pushes it runs as a called job
# inside the Web Release pipeline (web-release.yml) via workflow_call, so the
# green run that gates the deploy is the same one that tested the commit — a
# push trigger here would run the whole suite twice per release.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Verifies firestore.rules (incl. the issue #15 rate-limit ledger) against
  # the Firestore emulator — the same suite as scripts/test_rules.sh.
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache Firebase emulator jars
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install rules test harness
        run: npm install --no-audit --no-fund --prefix test/rules

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run rules tests against the emulator
        run: firebase emulators:exec --only firestore "node test/rules/rules_test.mjs"
