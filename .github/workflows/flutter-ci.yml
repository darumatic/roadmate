name: Flutter CI

# Runs standalone on pull requests. On master pushes it runs as a called job
# inside the Web Release pipeline (web-release.yml) via workflow_call, so the
# green run that gates the deploy is the same one that tested the commit — a
# push trigger here would run the whole suite twice per release.
on:
  pull_request:
  workflow_call:

# Least privilege, like every other workflow here: both jobs only read the
# repo. Without this block a standalone pull-request run gets the repository's
# DEFAULT token permissions, whatever they happen to be (CodeQL:
# actions/missing-workflow-permissions). Called from web-release.yml it must
# not ask for more than that caller grants — `contents: read` is exactly that.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # Verifies firestore.rules (incl. the issue #15 rate-limit ledger) against
  # the Firestore emulator — the same suite as scripts/test_rules.sh.
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '20'

      - name: Cache Firebase emulator jars
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install rules test harness
        run: npm install --no-audit --no-fund --prefix test/rules

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run rules tests against the emulator
        run: firebase emulators:exec --only firestore "node test/rules/rules_test.mjs"
