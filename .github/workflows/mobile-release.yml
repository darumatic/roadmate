name: Mobile Release

# The manual store-release step ("Run workflow" in the Actions tab, or:
#   gh workflow run mobile-release.yml -f platform=both).
# Builds and ships the signed Android AAB to Google Play production and/or
# the signed iOS IPA to App Store Connect (review submission included),
# reusing scripts/release_android.sh / scripts/release_ios.sh. A preflight
# job refuses to run unless this commit's Web Release pipeline succeeded —
# mobile follows a positive web release, never precedes it.
#
# dry_run builds everything but skips every store upload (safe rehearsal).
#
# Secrets (uploaded by scripts/setup_release_secrets.sh):
#   Android (from the VPS): ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD,
#     ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON
#   iOS (from the Mac):     IOS_DIST_P12_BASE64, IOS_DIST_P12_PASSWORD,
#     NTFY_TOPIC (release alerts; optional — unset makes them a no-op)
#     IOS_PROVISIONING_PROFILE_BASE64, ASC_KEY_ID, ASC_ISSUER_ID,
#     ASC_PRIVATE_KEY
#
# Store metadata comes from the committed tree: update
# store/google_play_release_notes.txt and store/apple_whats_new.txt BEFORE
# the release commit, as always. Play uploads are committed but not live
# until review (the owner may still need the console's Send-for-review).

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which store builds to release
        type: choice
        options:
          - both
          - android
          - ios
        default: both
      dry_run:
        description: Build only — skip every store upload
        type: boolean
        default: false
      commit:
        description: Commit sha to release (empty = latest master)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Require a green Web Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Refuse non-master refs
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Mobile releases run from master only (got $GITHUB_REF)." >&2
          exit 1

      - name: Resolve the release commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          # Empty input = latest master (the dispatch sha). A pasted sha lets
          # the owner ship the exact commit of a chosen green pipeline run even
          # after master has moved on. Never splice the input into scripts raw:
          # validate the shape, resolve short shas, require it to be on master.
          if [ -z "$INPUT_COMMIT" ]; then
            sha="$GITHUB_SHA"
          else
            if ! printf '%s' "$INPUT_COMMIT" | grep -qiE '^[0-9a-f]{7,40}$'; then
              echo "commit '$INPUT_COMMIT' is not a 7-40 character hex sha." >&2
              exit 1
            fi
            sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$INPUT_COMMIT" --jq .sha)" \
              || { echo "commit '$INPUT_COMMIT' not found in $GITHUB_REPOSITORY." >&2; exit 1; }
            status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...master" --jq .status)"
            case "$status" in
              ahead|identical) ;;
              *)
                echo "commit $sha is not on master (compare status: $status)." >&2
                echo "Store releases ship only commits master already contains." >&2
                exit 1;;
            esac
          fi
          echo "Releasing commit $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require a successful Web Release for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          n="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/web-release.yml/runs?head_sha=$SHA&status=success" \
            --jq '.total_count')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "No successful Web Release run for $SHA." >&2
            echo "Mobile ships only after a positive web release — let the Web" >&2
            echo "Release pipeline go green for this commit, then run this again." >&2
            exit 1
          fi
          echo "Web Release is green for $SHA."

  android:
    name: Android to Google Play
    needs: preflight
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Materialize signing + Play credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Android secrets are not set — run ./scripts/setup_release_secrets.sh on the VPS." >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$keystore"
          } > android/key.properties
          # Only a real release gets the Play uploader key: a dry run must not
          # be able to upload even by accident.
          if [ "$DRY_RUN" != "true" ]; then
            mkdir -p "$HOME/.config/roadmate"
            printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$HOME/.config/roadmate/google-play-service-account.json"
          fi

      - name: Build signed AAB (and upload to Play unless dry run)
        env:
          RELEASE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          # play_upload.py pushes a release alert naming the version; CI has no
          # ~/.config/roadmate, so the topic comes from the secret.
          ROADMATE_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./scripts/release_android.sh

  ios:
    name: iOS to App Store
    needs: preflight
    if: inputs.platform != 'android'
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.release_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing material (keychain + profile)
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$IOS_DIST_P12_BASE64" ]; then
            echo "iOS signing secrets are not set — run ./scripts/setup_release_secrets.sh" >&2
            echo "on the Mac once (uploads the .p12, profile and ASC key as secrets)." >&2
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          printf '%s' "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/dist.p12"
          # Let codesign use the key without a UI prompt, and put the temp
          # keychain on the search list so release_ios.sh's identity preflight
          # (security find-identity) sees it.
          security set-key-partition-list -S 'apple-tool:,apple:' -s -k "" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          # Install the profile where any Xcode resolves it by name: 16+ reads
          # UserData/Provisioning Profiles, older tooling the MobileDevice path.
          profiles="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          legacy="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles" "$legacy"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$profiles/RoadMate_App_Store.mobileprovision"
          cp "$profiles/RoadMate_App_Store.mobileprovision" "$legacy/"

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -n "$ASC_KEY_ID" ]; then
            mkdir -p "$HOME/.appstoreconnect/private_keys"
            printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          fi

      - name: Build signed IPA (and upload + submit unless dry run)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
          # asc_submit.py pushes a release alert naming the version.
          ROADMATE_NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          # Without ASC credentials release_ios.sh falls back to the
          # Transporter app, which does not exist on a runner — refuse instead
          # (a dry run stops before the upload and is fine without them).
          if [ -z "$ASC_KEY_ID" ] && [ "$RELEASE_DRY_RUN" != "1" ]; then
            echo "ASC_KEY_ID/ASC_ISSUER_ID secrets are missing — run" >&2
            echo "./scripts/setup_release_secrets.sh on the Mac, or use dry_run." >&2
            exit 1
          fi
          ./scripts/release_ios.sh
